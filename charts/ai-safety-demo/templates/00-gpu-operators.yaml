---
# ClusterPolicy + gpu-operator toleration patch. Runs after the GPU Operator CSV is Succeeded.
# ClusterPolicy is extracted from the CSV's alm-examples (sets use_ocp_driver_toolkit: true — no RHEL entitlement needed).
# The toleration patch keeps the gpu-operator manager schedulable when CPU nodes are down.
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-gpu-operator
  namespace: {{ .Values.gpu.gpuOperator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.rhoaiConfig | quote }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: {{ .Values.cli.image }}
          imagePullPolicy: {{ .Values.cli.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for GPU Operator CSV to be Succeeded..."
              DEADLINE=$(( $(date +%s) + {{ .Values.operators.approvalTimeoutSeconds }} ))
              while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                phase=$(oc get csv -n {{ .Values.gpu.gpuOperator.namespace }} {{ .Values.gpu.gpuOperator.startingCSV }} -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [ "$phase" = "Succeeded" ]; then echo "GPU Operator CSV Succeeded"; break; fi
                echo "GPU Operator CSV phase: ${phase:-not found} — waiting..."
                sleep 5
              done
              if [ "$phase" != "Succeeded" ]; then echo "GPU Operator CSV did not reach Succeeded in time (phase: $phase)" >&2; exit 1; fi
              echo "Creating ClusterPolicy from CSV alm-examples..."
              oc get csv -n {{ .Values.gpu.gpuOperator.namespace }} {{ .Values.gpu.gpuOperator.startingCSV }} \
                -o jsonpath='{.metadata.annotations.alm-examples}' \
                | jq -r 'map(select(.kind=="ClusterPolicy"))[0]' | oc apply -f -
              echo "Patching gpu-operator deployment to tolerate GPU taint..."
              oc patch deployment gpu-operator -n {{ .Values.gpu.gpuOperator.namespace }} --type=json \
                -p='[{"op":"add","path":"/spec/template/spec/tolerations","value":[{"key":"nvidia.com/gpu","operator":"Exists","effect":"NoSchedule"}]}]' 2>/dev/null \
                || echo "gpu-operator toleration patch skipped (already present or deployment not yet ready)"
              echo "GPU Operator configured — ClusterPolicy created"
{{- end }}
