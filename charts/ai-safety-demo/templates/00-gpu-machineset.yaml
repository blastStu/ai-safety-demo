{{- /*
GPU MachineSet for RHDP/IPI clusters: clones an existing worker-compute
MachineSet and patches instanceType/accelerator label/taint. No rosa CLI.
Gate: gpu.machinePool.create=true. Uses oc + python3 (no jq in ose-cli).
*/ -}}
{{- if and .Values.gpu.enabled .Values.gpu.machinePool.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: create-gpu-machineset
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.namespaces | quote }}
rules:
  - apiGroups: ["machine.openshift.io"]
    resources: ["machinesets"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: create-gpu-machineset
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.namespaces | quote }}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.operators.rhoai.namespace }}
roleRef:
  kind: ClusterRole
  name: create-gpu-machineset
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-gpu-machineset
  namespace: {{ .Values.operators.rhoai.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.rhoaiConfig | quote }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
        - name: create
          image: {{ .Values.cli.image }}
          imagePullPolicy: {{ .Values.cli.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              INSTANCE_TYPE={{ .Values.gpu.machinePool.instanceType | quote }}
              REPLICAS={{ .Values.gpu.machinePool.replicas }}
              ACC_LABEL={{ .Values.gpu.machinePool.acceleratorLabel | quote }}
              TAINT_KEY={{ .Values.gpu.machinePool.taintKey | quote }}
              TAINT_VAL={{ .Values.gpu.machinePool.taintValue | quote }}
              # Find template MachineSet without jq (ose-cli has no jq — use name + jsonpath).
              SRC=""
              for ms in $(oc get machineset -n openshift-machine-api -o name 2>/dev/null | cut -d/ -f2); do
                if echo "$ms" | grep -q "worker.*compute"; then
                  REPS=$(oc get machineset "$ms" -n openshift-machine-api -o jsonpath='{.spec.replicas}' 2>/dev/null || echo 0)
                  if [ "$REPS" -gt 0 ] 2>/dev/null; then SRC="$ms"; break; fi
                fi
              done
              if [ -z "$SRC" ]; then
                for ms in $(oc get machineset -n openshift-machine-api -o name 2>/dev/null | cut -d/ -f2); do
                  if echo "$ms" | grep -q "worker"; then SRC="$ms"; break; fi
                done
              fi
              if [ -z "$SRC" ]; then echo "No worker MachineSet found — is this ROSA HCP?" >&2; exit 1; fi
              echo "Template MachineSet: $SRC"
              REGION=$(oc get machineset "$SRC" -n openshift-machine-api -o jsonpath='{.spec.template.spec.providerSpec.value.placement.region}' 2>/dev/null || echo "")
              AZ=$(oc get machineset "$SRC" -n openshift-machine-api -o jsonpath='{.spec.template.spec.providerSpec.value.placement.availabilityZone}' 2>/dev/null || echo "")
              if [ -n "$AZ" ]; then AZ_SFX="-${AZ##*-}"; else AZ_SFX=""; fi
              NEW_NAME="gpu-${INSTANCE_TYPE}${AZ_SFX}"
              NEW_NAME=$(echo "$NEW_NAME" | tr '_' '-' | cut -c1-63)
              export NEW_NAME INSTANCE_TYPE REPLICAS ACC_LABEL TAINT_KEY TAINT_VAL
              if oc get machineset "$NEW_NAME" -n openshift-machine-api >/dev/null 2>&1; then
                echo "MachineSet $NEW_NAME exists — ensuring replicas=$REPLICAS"
                oc scale machineset "$NEW_NAME" -n openshift-machine-api --replicas="$REPLICAS" 2>/dev/null || \
                  oc patch machineset "$NEW_NAME" -n openshift-machine-api --type merge -p "{\"spec\":{\"replicas\":$REPLICAS}}"
                exit 0
              fi
              echo "Creating MachineSet $NEW_NAME (instanceType=$INSTANCE_TYPE replicas=$REPLICAS taint=$TAINT_KEY:NoSchedule)"
              # Clone via python3 (present in ose-cli) — no jq needed.
              oc get machineset "$SRC" -n openshift-machine-api -o json | python3 -c "
              import json, sys, os
              src=json.load(sys.stdin)
              new_name=os.environ['NEW_NAME']
              instance_type=os.environ['INSTANCE_TYPE']
              acc_label=os.environ['ACC_LABEL']
              taint_key=os.environ['TAINT_KEY']
              taint_val=os.environ['TAINT_VAL']
              replicas=int(os.environ['REPLICAS'])
              # strip server-side fields
              for k in ['uid','resourceVersion','creationTimestamp','generation','managedFields','selfLink','ownerReferences','finalizers']:
                  src['metadata'].pop(k, None)
              if 'annotations' in src['metadata']:
                  src['metadata']['annotations'].pop('kubectl.kubernetes.io/last-applied-configuration', None)
              src['metadata']['name']=new_name
              src['spec']['replicas']=replicas
              src['spec']['selector']['matchLabels']['machine.openshift.io/cluster-api-machineset']=new_name
              src['spec']['template']['metadata']['labels']['machine.openshift.io/cluster-api-machineset']=new_name
              src['spec']['template']['spec']['providerSpec']['value']['instanceType']=instance_type
              # bump root volume for large modelcars (e.g. qwen 37GB) + ephemeral cache
              try:
                  for bd in src['spec']['template']['spec']['providerSpec']['value'].get('blockDevices', []):
                      if 'ebs' in bd and 'volumeSize' in bd['ebs']:
                          bd['ebs']['volumeSize']=300
              except: pass
              if 'metadata' not in src['spec']['template']['spec']:
                  src['spec']['template']['spec']['metadata']={}
              if 'labels' not in src['spec']['template']['spec']['metadata']:
                  src['spec']['template']['spec']['metadata']['labels']={}
              src['spec']['template']['spec']['metadata']['labels']['cluster-api/accelerator']=acc_label
              src['spec']['template']['spec']['taints']=[{'effect':'NoSchedule','key':taint_key,'value':taint_val}]
              json.dump(src, sys.stdout)
              " | oc apply -f -
              echo "MachineSet $NEW_NAME created"
{{- end }}
