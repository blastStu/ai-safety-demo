{{- /*
Gate between the DSC patch (wave 2) and the RHOAI CRs (waves 4-6).
Argo validates the whole app before syncing, and on a fresh cluster the DSPA/MLflow/
EvalHub/TrustyAI CRDs do not exist yet. The CRs carry
`argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true` so validation is
skipped, and this hook blocks the CR waves until the operator has registered the CRDs.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wait-for-rhoai-crds
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.configMaps | quote }}
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wait-for-rhoai-crds
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.configMaps | quote }}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.evalhub.namespace }}
roleRef:
  kind: ClusterRole
  name: wait-for-rhoai-crds
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-rhoai-crds
  namespace: {{ .Values.evalhub.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.crds | quote }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: {{ .Values.cli.image }}
          imagePullPolicy: {{ .Values.cli.imagePullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              CRDS="datasciencepipelinesapplications.datasciencepipelinesapplications.opendatahub.io mlflows.mlflow.opendatahub.io evalhubs.trustyai.opendatahub.io trustyaiservices.trustyai.opendatahub.io"
              DEADLINE=$(( $(date +%s) + {{ .Values.crds.waitTimeoutSeconds }} ))
              while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                missing=""
                for c in $CRDS; do
                  oc get crd "$c" >/dev/null 2>&1 || missing="$missing $c"
                done
                if [ -z "$missing" ]; then
                  echo "All RHOAI CRDs are present"
                  exit 0
                fi
                echo "Waiting for CRDs:$missing"
                sleep 5
              done
              echo "Timed out after {{ .Values.crds.waitTimeoutSeconds }}s waiting for CRDs:$missing" >&2
              exit 1
