# Creates evalhub-db-credentials from the postgresql Secret's database-password.
# EvalHub mounts this as its database url; without it the pod FailedMounts.
# Argo PreSync hook so it runs before EvalHub is applied; also safe to run via oc apply -k (Job is idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: create-evalhub-db-credentials
  namespace: evalhub
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
        - name: create-secret
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DB_PASS=$(oc get secret postgresql -n evalhub -o jsonpath='{.data.database-password}' | base64 -d)
              oc create secret generic evalhub-db-credentials -n evalhub \
                --from-literal=db-url="postgres://evalhub:${DB_PASS}@postgresql.evalhub.svc.cluster.local:5432/evalhub" \
                --from-literal=database-password="${DB_PASS}" \
                --dry-run=client -o yaml | oc apply -f -
              echo "created evalhub-db-credentials"
