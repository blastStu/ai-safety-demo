# PostgreSQL credentials for EvalHub — generated on first install; do not commit real values.
# This is a placeholder that 03-deploy-dspa-mlflow.sh overwrites with a random password;
# for GitOps, replace with a SealedSecret or ExternalSecret before pointing Argo at overlays/rhdp.
apiVersion: v1
kind: Secret
metadata:
  name: postgresql
  namespace: evalhub
type: Opaque
stringData:
  database-name: evalhub
  database-user: evalhub
  database-password: REPLACE_ME_GENERATE_16CHAR
