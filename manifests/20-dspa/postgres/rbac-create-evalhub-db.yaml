apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: create-evalhub-db-credentials
  namespace: evalhub
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["postgresql"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create","get","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: create-evalhub-db-credentials
  namespace: evalhub
subjects:
  - kind: ServiceAccount
    name: default
    namespace: evalhub
roleRef:
  kind: Role
  name: create-evalhub-db-credentials
  apiGroup: rbac.authorization.k8s.io
