# S3-compatible credentials for SeaweedFS (mirrors MinIO's shape for DSPA/MLflow).
# The KFP pipeline steps mount these 5 AWS_* keys from seaweedfs-evalhub-credentials in evalhub (see 03/04 scripts).
# Template — real value created out of git (5 keys, not 2 — KFP's envFrom requires all 5):
#   oc create secret generic seaweedfs-secret -n seaweedfs --from-literal=AWS_ACCESS_KEY_ID=THEACCESSKEY --from-literal=AWS_SECRET_ACCESS_KEY=THESECRETKEY --from-literal=AWS_S3_ENDPOINT=http://seaweedfs.seaweedfs.svc:8333 --from-literal=AWS_S3_BUCKET=evalhub --from-literal=AWS_DEFAULT_REGION=us-east-1
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-secret
  namespace: seaweedfs
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: THEACCESSKEY
  AWS_SECRET_ACCESS_KEY: THESECRETKEY
  AWS_S3_ENDPOINT: http://seaweedfs.seaweedfs.svc:8333
  AWS_S3_BUCKET: evalhub
  AWS_DEFAULT_REGION: us-east-1
