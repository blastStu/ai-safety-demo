# Copies SeaweedFS S3 credentials into evalhub namespace where DSPA expects them.
# DSPA's s3CredentialsSecret and the garak-kfp pipeline steps both mount this.
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-seaweedfs-credentials-to-evalhub
  namespace: seaweedfs
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
        - name: copy-secret
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              oc create secret generic seaweedfs-evalhub-credentials -n evalhub \
                --from-literal=AWS_ACCESS_KEY_ID=THEACCESSKEY \
                --from-literal=AWS_SECRET_ACCESS_KEY=THESECRETKEY \
                --from-literal=AWS_S3_ENDPOINT=http://seaweedfs.seaweedfs.svc:8333 \
                --from-literal=AWS_S3_BUCKET=evalhub \
                --from-literal=AWS_DEFAULT_REGION=us-east-1 \
                --dry-run=client -o yaml | oc apply -f -
              echo "created seaweedfs-evalhub-credentials in evalhub"
