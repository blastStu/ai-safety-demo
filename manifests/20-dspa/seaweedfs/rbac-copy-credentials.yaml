apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: copy-seaweedfs-credentials
  namespace: seaweedfs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["seaweedfs-secret"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: copy-seaweedfs-credentials
  namespace: seaweedfs
subjects:
  - kind: ServiceAccount
    name: default
    namespace: seaweedfs
roleRef:
  kind: Role
  name: copy-seaweedfs-credentials
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: create-seaweedfs-credentials
  namespace: evalhub
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create","get","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: create-seaweedfs-credentials
  namespace: evalhub
subjects:
  - kind: ServiceAccount
    name: default
    namespace: seaweedfs
roleRef:
  kind: Role
  name: create-seaweedfs-credentials
  apiGroup: rbac.authorization.k8s.io
