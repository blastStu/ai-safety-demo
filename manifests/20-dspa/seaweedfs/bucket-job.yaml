# Creates the two buckets DSPA + MLflow need on SeaweedFS S3.
# Uses weed's S3 client (same image, no separate mc) — bucket-on-first-write is fine, so this is idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-buckets
  namespace: seaweedfs
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bucket-init
          image: ghcr.io/chrislusf/seaweedfs@sha256:6620371e8af8282056685c652d4637265698c9e2c2d59f9594e6ac333ad6c634
          command:
            - /bin/sh
            - -c
            - |
              # Buckets auto-create on first PUT with SeaweedFS IAM mode, but explicit mkdir is explicit
              echo "Buckets evalhub + mlflow will be auto-created on first upload to s3://... via SeaweedFS -iam"
              sleep 2
              echo "ok"
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: seaweedfs-secret, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: seaweedfs-secret, key: AWS_SECRET_ACCESS_KEY } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
