apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-safety-demo
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/blastStu/ai-safety-demo
    targetRevision: main
    path: overlays/rhdp
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
