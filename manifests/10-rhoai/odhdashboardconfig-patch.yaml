# Enable dashboard feature flags needed for EvalHub UI in RHOAI 3.5.3.
# Apply: oc patch odhdashboardconfig odh-dashboard-config -n redhat-ods-applications --type=merge --patch-file manifests/10-rhoai/odhdashboardconfig-patch.yaml
# Or:    oc apply -k manifests/10-rhoai (if this patch is listed in its kustomization)
# Effect: immediate on browser refresh — no dashboard restart required.
apiVersion: opendatahub.io/v1alpha
kind: OdhDashboardConfig
metadata:
  name: odh-dashboard-config
  namespace: redhat-ods-applications
spec:
  dashboardConfig:
    # Core for V1.1 — without these the Evaluations tab is hidden and external target URLs are blocked:
    disableLMEval: false        # double-negative: false = enable both LM Eval + Safety insights
    externalModels: true        # allow external OpenAI-compatible endpoint in Eval form
    # Full recommended set (avoid "Unavailable in the cluster" whack-a-mole — skill Step 7.9.6):
    disableTracking: false
    connectionTest: true
    mcpCatalog: true
    agentsCatalog: true
    agentOps: true
    agentConfigManagement: true
    mcpRegistry: true
    guardrails: true            # Playground safety filter only — separate from NeMo Guardrails CR
    genAiStudio: true
    genAiTracing: true
    promptManagement: true
    globalProjectPrompts: true
    autorag: true
    automl: true
    observabilityDashboard: true
    trainingJobs: true
    featureStoreAdmin: true
    gpuaas: true
    toolCalling: true
    roleManagement: true
    projectRBAC: true
    externalVectorStores: true
    llmdTemplates: true
    vLLMDeploymentOnMaaS: true
