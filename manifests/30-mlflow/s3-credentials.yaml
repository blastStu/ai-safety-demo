# Template — real secret created from SeaweedFS creds after seaweedfs apply.
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-s3-credentials
  namespace: redhat-ods-applications
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_ME_SEAWEEDFS_ACCESS_KEY # THEACCESSKEY
  AWS_SECRET_ACCESS_KEY: REPLACE_ME_SEAWEEDFS_SECRET_KEY # THESECRETKEY
  AWS_DEFAULT_REGION: us-east-1
  MLFLOW_S3_ENDPOINT_URL: http://seaweedfs.seaweedfs.svc.cluster.local:8333
