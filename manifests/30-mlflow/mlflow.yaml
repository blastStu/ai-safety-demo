# Single MLflow instance per cluster — name MUST be "mlflow", namespace redhat-ods-applications.
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
  namespace: redhat-ods-applications
spec:
  backendStoreUri: sqlite:////mlflow/mlflow.db # four slashes = absolute /mlflow where PVC mounts
  artifactsDestination: s3://mlflow/artifacts
  defaultArtifactRoot: s3://mlflow/artifacts
  # 3.6: s3SecretName removed from the CRD; inject via envFrom (chart 40-mlflow.yaml does the same).
  envFrom:
    - secretRef:
        name: mlflow-s3-credentials
  replicas: 1
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 10Gi
    # storageClassName left default (gp3-csi on ROSA) — matches DSC's own mlflow PVC
