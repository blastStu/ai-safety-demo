apiVersion: batch/v1
kind: Job
metadata:
  name: create-mlflow-s3-credentials
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  template:
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
        - name: create-secret
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Copy SeaweedFS S3 creds for MLflow's envFrom secret (no jq in ose-cli — use jsonpath + base64 -d).
              ACCESS_B64=$(oc get secret seaweedfs-secret -n seaweedfs -o jsonpath='{.data.AWS_ACCESS_KEY_ID}')
              SECRET_B64=$(oc get secret seaweedfs-secret -n seaweedfs -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}')
              oc create secret generic mlflow-s3-credentials -n redhat-ods-applications \
                --from-literal=AWS_ACCESS_KEY_ID="$(echo "$ACCESS_B64" | base64 -d)" \
                --from-literal=AWS_SECRET_ACCESS_KEY="$(echo "$SECRET_B64" | base64 -d)" \
                --from-literal=AWS_DEFAULT_REGION=us-east-1 \
                --from-literal=MLFLOW_S3_ENDPOINT_URL=http://seaweedfs.seaweedfs.svc:8333 \
                --dry-run=client -o yaml | oc apply -f -
              echo "created mlflow-s3-credentials from seaweedfs-secret"
