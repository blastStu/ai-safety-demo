apiVersion: batch/v1
kind: Job
metadata:
  name: create-mlflow-s3-credentials
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  template:
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      containers:
        - name: create-secret
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Copy SeaweedFS S3 creds into redhat-ods-applications for MLflow's s3SecretName
              oc get secret seaweedfs-secret -n seaweedfs -o json | \
                jq '.metadata.namespace="redhat-ods-applications" | .metadata.name="mlflow-s3-credentials" | .data |= with_entries(select(.key=="AWS_ACCESS_KEY_ID" or .key=="AWS_SECRET_ACCESS_KEY")) | .data["AWS_DEFAULT_REGION"]="us-east-1" | .data["MLFLOW_S3_ENDPOINT_URL"]="aHR0cDovL3NlYXdlZWRmcy5zZWF3ZWVkZnMuc3ZjLmNsdXN0ZXIubG9jYWw6ODMzMw=="' | \
                oc apply -f -
              echo "created mlflow-s3-credentials from seaweedfs-secret"
