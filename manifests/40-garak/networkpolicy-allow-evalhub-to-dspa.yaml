apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-evalhub-jobs-to-dspa-apiserver
  namespace: evalhub
spec:
  podSelector:
    matchLabels:
      app: ds-pipeline-dspa
      component: data-science-pipelines
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: evalhub
              component: evaluation-job
      ports:
        - protocol: TCP
          port: 8888
