# Garak probe selection + external endpoint wiring for garak-kfp.
# The KFP-compiled pipeline YAML (once generated via kfp dsl compile) will reference these as inputs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garak-pipeline-config
  namespace: evalhub
data:
  targetBaseUrl: "REPLACE_ME_TARGET_BASE_URL/v1/chat/completions"
  abliteratedBaseUrl: "REPLACE_ME_ABLITERATED_BASE_URL/v1/chat/completions"
  # probe sets — keep constant between baseline and guarded runs (V1.2) for valid comparison
  garakProbes: "promptinject,realtoxicityprompts,encoding"
  judgeModel: "REPLACE_ME_JUDGE_MODEL_IF_USED"
  promptSeed: "42"
